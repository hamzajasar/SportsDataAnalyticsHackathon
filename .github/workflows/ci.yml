name: CI

# Workflow: feature/<name> branches off dev -> merged into dev once tests pass (no PRs)
# -> main only at the very end. CI runs on every pushed branch.
on:
  push:
    branches: ["**"]

# Least privilege: CI can only read the repo
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full git history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1
      - name: No dataset files committed
        run: |
          bad=$(git ls-files | grep -Ei '\.(csv|tsv|xlsx?|parquet|feather|jsonl|ndjson|zip|gz)$' \
            | grep -v '^backend/app/reference/' || true)
          if [ -n "$bad" ]; then echo "::error::Dataset files must not be committed:"; echo "$bad"; exit 1; fi
      - name: Notebooks have no outputs
        run: |
          pip install --quiet nbstripout
          files=$(git ls-files '*.ipynb')
          [ -z "$files" ] || nbstripout --verify $files


  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hackathon
          POSTGRES_PASSWORD: hackathon
          POSTGRES_DB: hackathon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hackathon" --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hackathon:hackathon@localhost:5432/hackathon
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . ../notebooks
      - run: uv run ruff format --check . ../notebooks
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Models and migrations are in sync
        run: uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Generated API client matches backend
        run: |
          (cd backend && uv sync --frozen && uv run python -m scripts.export_openapi)
          (cd frontend && npm run gen:api)
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts \
            || (echo "::error::API client out of date - run 'make gen-api' and commit" && exit 1)
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
