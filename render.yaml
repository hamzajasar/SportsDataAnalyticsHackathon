# Render blueprint for the backend (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: sports-analytics-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
