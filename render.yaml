# Render Blueprint: backend API + free Postgres. Deploys from the `dev` branch.
# Setup steps: docs/DEPLOY.md
services:
  - type: web
    name: club-footprint-api
    runtime: docker
    plan: free
    branch: dev
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: club-footprint-db
          property: connectionString
      - key: CORS_ORIGINS # set after the frontend is deployed, e.g. ["https://xyz.vercel.app"]
        sync: false

databases:
  - name: club-footprint-db
    plan: free
    databaseName: hackathon
    user: hackathon
