# Render blueprint for the backend (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: sports-analytics-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      # "Snap your bill" reads photos with the Claude API (paid per call). Without it the feature
      # answers 503 and the rest of the app works. Set it in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
